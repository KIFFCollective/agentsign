name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: git version && ssh -V
      - name: vet
        run: go vet ./...
      - name: YAML is valid (action.yml is loaded by every user's workflow)
        if: runner.os == 'Linux'
        run: for f in action/action.yml .goreleaser.yaml .github/workflows/*.yml; do yq '.' "$f" > /dev/null || exit 1; done
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: test
        run: go test -race ./...

  # Oldest git that supports SSH signing.
  git-2-34:
    runs-on: ubuntu-latest
    container: ubuntu:22.04 # ships git 2.34.1
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git openssh-client ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go test ./...
